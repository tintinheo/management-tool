<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    /* Height must stay intrinsic to the content. If this is ever allowed to grow to the
       iframe's current (parent-assigned) height, measuring scrollHeight below would read that
       inflated size back and keep growing the iframe forever (a runaway resize feedback loop). */
    height: auto;
    overflow: hidden;
    font-family: "Source Sans Pro", sans-serif;
    background: transparent;
  }
  #container {
    white-space: pre-wrap;
    line-height: 1.6;
    padding: 2px 4px;
    font-size: 0.95rem;
    color: inherit;
  }
  #addBtn {
    position: absolute;
    display: none;
    z-index: 999999;
    background: #ff4b4b;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
  }
  #addBtn:hover {
    background: #e63946;
  }
  /* Touch screens: a finger-sized button (the 12px desktop button is too small to hit reliably). */
  @media (pointer: coarse) {
    #addBtn {
      padding: 9px 14px;
      font-size: 14px;
      border-radius: 8px;
    }
  }
</style>
</head>
<body>
<div id="container"></div>
<button id="addBtn" type="button">➕ Add to Vocabulary</button>
<script>
(function () {
  function sendMessage(type, data) {
    var payload = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(payload, "*");
  }
  function notifyReady() {
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
  }
  var lastSentHeight = null;
  function setFrameHeight() {
    // Measure document.body only. document.documentElement.scrollHeight equals
    // max(body height, current viewport height), so once the iframe itself is resized
    // taller, re-measuring documentElement would read that inflated viewport height back
    // and grow further on every render -- a runaway feedback loop that looks like constant
    // flicker/resizing ("jerking") as the conversation grows.
    var height = document.body.scrollHeight + 12;
    if (height === lastSentHeight) return;
    lastSentHeight = height;
    sendMessage("streamlit:setFrameHeight", { height: height });
  }
  function sendValue(value) {
    sendMessage("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  var container = document.getElementById("container");
  var addBtn = document.getElementById("addBtn");
  var pendingSelection = "";

  function hideButton() {
    addBtn.style.display = "none";
    pendingSelection = "";
  }

  function showButtonForSelection() {
    var sel = window.getSelection();
    var text = sel && sel.toString ? sel.toString().trim() : "";
    if (!text || !sel.rangeCount || !container.contains(sel.anchorNode)) {
      hideButton();
      return;
    }
    pendingSelection = text;
    var range = sel.getRangeAt(0);
    var rect = range.getBoundingClientRect();
    addBtn.style.display = "block";
    var btnHeight = addBtn.offsetHeight || 32;
    var top;
    if (isTouch && rect.bottom + 8 + btnHeight <= document.body.scrollHeight) {
      // Android/iOS show their own Copy/Share bar above a selection, so put ours below it when it fits.
      top = rect.bottom + 8 + window.scrollY;
    } else {
      top = Math.max(0, rect.top - btnHeight - 4 + window.scrollY);
    }
    var maxLeft = Math.max(0, document.body.clientWidth - addBtn.offsetWidth - 4);
    var left = Math.min(Math.max(0, rect.left + window.scrollX), maxLeft);
    addBtn.style.top = top + "px";
    addBtn.style.left = left + "px";
  }

  var isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

  document.addEventListener("mouseup", function () {
    setTimeout(showButtonForSelection, 0);
  });
  document.addEventListener("dblclick", function () {
    setTimeout(showButtonForSelection, 0);
  });
  document.addEventListener("keyup", function (e) {
    if (e.shiftKey) setTimeout(showButtonForSelection, 0);
  });
  // Touch: long-press selection (and dragging the selection handles) fires selectionchange, not mouseup.
  var selectionTimer = null;
  document.addEventListener("selectionchange", function () {
    clearTimeout(selectionTimer);
    selectionTimer = setTimeout(showButtonForSelection, 250);
  });

  function commitSelection() {
    if (pendingSelection) {
      sendValue({ text: pendingSelection, nonce: Date.now() + Math.random() });
      hideButton();
      window.getSelection().removeAllRanges();
    }
  }

  // Keep the selection alive when the pointer goes down on the button itself. On touch screens the tap
  // would otherwise collapse the selection before "click" fires, so commit straight away on pointerdown.
  addBtn.addEventListener("mousedown", function (e) {
    e.preventDefault();
  });
  addBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (e.pointerType === "touch" || e.pointerType === "pen") commitSelection();
  });
  addBtn.addEventListener("click", commitSelection);

  document.addEventListener("mousedown", function (e) {
    if (e.target !== addBtn) {
      hideButton();
    }
  });

  var lastHtml = null;
  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var args = (data.args || {});
    var newHtml = args.html || "";
    // Streamlit re-sends "streamlit:render" on every app rerun, even when our own args haven't
    // changed. Only touch the DOM (and clear any in-progress selection) when the content actually changed.
    if (newHtml !== lastHtml) {
      lastHtml = newHtml;
      container.innerHTML = newHtml;
      hideButton();
    }
    setTimeout(setFrameHeight, 10);
  });

  notifyReady();
  setTimeout(setFrameHeight, 50);
})();
</script>
</body>
</html>
